name: xyz-depth

on:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pillow
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python operator_plate.py
      - run: python obj_xyz_world.py --selftest
      - run: python xyz_operator_train.py --selftest

  procedural-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python xyz_operator_train.py --run --procedural
          --device cpu --height 20 --width 20
          --nx 3 --ny 2 --nz 5 --basis-dim 6 --operator-dim 6
          --steps 180 --seeds 1 --out-dir xyz_smoke_out
      - uses: actions/upload-artifact@v4
        with:
          name: xyz-depth-smoke
          path: xyz_smoke_out/
