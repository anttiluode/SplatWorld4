name: active-inverse-world

on:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy
      - run: python -m unittest discover -s tests -p 'test_active_inverse_core.py' -v
