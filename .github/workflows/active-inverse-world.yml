name: active-inverse-world

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pillow
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_active_inverse_*.py' -v
      - run: python active_inverse_world.py --selftest

  active-vs-random-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python active_inverse_world.py --run --device cpu
          --seeds 3 --random-repeats 4
          --operator-dim 5 --camera-views 7 --image-size 8
          --features-per-view 3 --hidden-magnitude 0.22
          --max-views 3 --inner-steps 2
          --out-dir active_inverse_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: active-inverse-smoke
          path: active_inverse_smoke/
